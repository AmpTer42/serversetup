name: Lint Nu Scripts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: rust:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install nu-lint
        run: cargo install nu-lint --locked

      - name: Run nu-lint
        run: nu-lint --format compact --config .nu-lint.toml . > lint.txt

      - name: Upload lint artifact
        uses: actions/upload-artifact@v7
        with:
          name: lint.txt
          path: |
            lint.txt
