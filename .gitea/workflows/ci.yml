name: Lint Nu Scripts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Install nu-lint
        run: cargo +stable install nu-lint

      - name: Run nu-lint
        run: nu-lint --format compact --config .nu-lint.toml . > lint.txt

      - name: Upload lint artifact
        uses: actions/upload-artifact@v7
        with:
          name: lint.txt
          path: |
            lint.txt
